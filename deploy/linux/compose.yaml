name: plan-reminder-postgres
services:
  db:
    image: plan-reminder-db:18.6
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: plan_reminder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Missing database administrator password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Missing application database password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d plan_reminder"]
      interval: 5s
      timeout: 5s
      retries: 24
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  app:
    image: ${APP_IMAGE:-plan-reminder:2026-09-15-postgres}
    entrypoint: [/usr/local/bin/node]
    command: [server.js]
    pull_policy: never
    restart: unless-stopped
    init: true
    depends_on:
      db: {condition: service_healthy}
    env_file:
      - path: .app.env
        format: raw
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3005}:3005"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 15s
    logging: *logging
  pgadmin:
    image: plan-reminder-pgadmin:9.17
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Missing pgAdmin password}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5052}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    logging: *logging
  migrate-json:
    image: ${APP_IMAGE:-plan-reminder:2026-09-15-postgres}
    pull_policy: never
    profiles: [migration]
    user: node
    depends_on:
      db: {condition: service_healthy}
    env_file:
      - path: .app.env
        format: raw
    entrypoint: [/usr/local/bin/node]
    command: [scripts/import-json.js, /migration]
    volumes:
      - ${MIGRATION_DIR:?Missing migration snapshot}:/migration:ro
    read_only: true
volumes:
  postgres-data:
  pgadmin-data:
