name: plan-reminder-postgres
x-app-environment: &app-environment
  NODE_ENV: production
  PORT: "3005"
  TZ: ${TZ:-Asia/Kathmandu}
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: plan_reminder
  PGUSER: plan_reminder_app
  PGPASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.postgres}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.postgres}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  PUBLIC_URL: ${PUBLIC_URL:-}
  TRUST_PROXY: ${TRUST_PROXY:-}
  DISABLE_SCHEDULER: ${DISABLE_SCHEDULER:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plan_reminder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env.postgres}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.postgres}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d plan_reminder"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  app:
    image: plan-reminder:2026-09-15-postgres
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db: {condition: service_healthy}
    environment: *app-environment
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3005}:3005"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    logging: *logging
  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env.postgres}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5052}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    logging: *logging
  migrate-json:
    image: plan-reminder:2026-09-15-postgres
    profiles: [migration]
    user: root
    depends_on:
      db: {condition: service_healthy}
    environment: *app-environment
    command: [node, scripts/import-json.js, /migration]
    volumes:
      - ${MIGRATION_DIR:-./migration}:/migration:ro
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
volumes:
  postgres-data:
  pgadmin-data:
